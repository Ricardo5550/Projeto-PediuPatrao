<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Pedidos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>

        <button type="button"
                class="btn btn-primary"
                data-bs-toggle="collapse"
                data-bs-target="#formularioPedido"
                aria-expanded="false"
                aria-controls="formularioPedido">
            <i class="bi bi-plus-lg me-1"></i>Novo Pedido
        </button>
    </div>

    <!-- Formulário de novo pedido -->
    <div class="collapse mb-4" id="formularioPedido">
        <div class="card shadow-sm">
            <div class="card-body p-4">

                <h5 class="fw-bold mb-3">Cadastrar Pedido</h5>

                <form id="pedidoForm">

                    <!-- Cliente -->
                    <div class="mb-3">
                        <label for="clienteId" class="form-label">
                            ID do Cliente
                        </label>
                        <input type="text"
                               id="clienteId"
                               class="form-control"
                               placeholder="Informe o ID do cliente"
                               required>
                    </div>

                    <!-- Itens do pedido -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Itens do Pedido</label>

                        <div id="itensPedido">
                            <div class="row g-2 mb-2 item-pedido">
                                <div class="col-md-8">
                                    <select class="form-select produto-item" required>
                                        <option value="">Selecione um produto</option>
                                    </select>
                                </div>

                                <div class="col-md-4">
                                    <input type="number"
                                           class="form-control quantidade-item"
                                           min="1"
                                           value="1"
                                           required>
                                </div>
                            </div>
                        </div>

                        <button type="button"
                                id="adicionarItem"
                                class="btn btn-outline-primary btn-sm mt-2">
                            <i class="bi bi-plus-lg me-1"></i>Adicionar Item
                        </button>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            Registrar Pedido
                        </button>
                        <button type="button"
                                class="btn btn-outline-secondary"
                                data-bs-toggle="collapse"
                                data-bs-target="#formularioPedido">
                            Cancelar
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabela -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">

                <thead class="table-dark">
                <tr>
                    <th class="ps-4">ID</th>
                    <th>Cliente ID</th>
                    <th>Itens</th>
                    <th>Quantidade</th>
                    <th>Subtotal</th>
                    <th>Desconto</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Responsável</th>
                    <th>Ações</th>
                    <th>Aplicar desconto</th>
                </tr>
                </thead>

                <tbody>
                    <!-- Lista vazia -->
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="11" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum pedido encontrado.
                        </td>
                    </tr>
                    <!-- Linhas -->

                    <tr th:each="pedido : ${pedidos}">
                        <td class="ps-4 text-muted" th:text="${pedido.id}"></td>
                        <td th:text="${pedido.clienteId}"></td>

                        <!-- Itens -->
                        <td>
                            <div th:each="item : ${pedido.itens}">

                                <span class="nome-produto"
                                      th:attr="data-produto-id=${item.produtoId}"
                                      th:text="${item.produtoId}">
                                </span>
                                <span th:text="' — ' + ${item.quantidade} + ' un.'"></span>

                            </div>
                        </td>

                        <!-- Quantidade total -->
                        <td>
                            <span th:text="${pedido.itens != null ? #aggregates.sum(pedido.itens.![quantidade]) : 0}"></span>
                        </td>

                        <!-- Subtotal -->
                        <td th:text="${pedido.valorSubtotal != null ? 'R$ ' + #numbers.formatDecimal(pedido.valorSubtotal, 1, 'POINT', 2, 'COMMA') : '—'}"></td>

                        <!-- Desconto -->
                        <td th:text="${pedido.percentualDesconto != null ? pedido.percentualDesconto + '%' : '0%'}"></td>

                        <!-- Total -->
                        <td th:text="${pedido.valorTotal != null ? 'R$ ' + #numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA') : '—'}"></td>


                        <!-- Status -->
                        <td>
                            <span class="badge"
                                  th:classappend="${pedido.status == 'FINALIZADO'} ? 'bg-success' :
                                                  (${pedido.status == 'CANCELADO'} ? 'bg-danger' :
                                                  (${pedido.status == 'EM_PREPARAÇÃO'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                                  th:text="${pedido.status}">
                            </span>
                        </td>

                        <!-- Responsável -->
                        <td th:text="${pedido.responsavelEntrada != null ? pedido.responsavelEntrada : '—'}"></td>

                        <!-- Ações -->
                        <td>
                            <select class="form-select form-select-sm status-pedido">
                                <option value="">Selecione</option>
                                <option value="EM_PREPARACAO">Em preparação</option>
                                <option value="PRONTO">Pronto</option>
                                <option value="SAIU_PARA_ENTREGA">Saiu para entrega</option>
                                <option value="RETIRADO">Retirado</option>
                                <option value="FINALIZADO">Finalizado</option>
                            </select>

                            <button type="button"
                                    class="btn btn-primary btn-sm mt-2 atualizar-status"
                                    th:attr="data-pedido-id=${pedido.id}">
                                Atualizar
                            </button>

                            <button type="button"
                                    class="btn btn-danger btn-sm mt-2 cancelar-pedido"
                                    th:attr="data-pedido-id=${pedido.id}">
                                Cancelar pedido
                            </button>
                        </td>

                        <!-- Aplicar desconto -->
                        <td>
                            <input type="number"
                                   class="form-control form-control-sm percentual-desconto"
                                   min="0"
                                   max="20"
                                   step="0.01"
                                   placeholder="0 a 20%">

                            <button type="button"
                                    class="btn btn-success btn-sm mt-2 aplicar-desconto"
                                    th:attr="data-pedido-id=${pedido.id}">
                                Aplicar
                            </button>
                        </td>
                    </tr>

                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(pedidos)}">
            Total: <strong th:text="${#lists.size(pedidos)}"></strong> pedido(s)
        </div>
    </div>

    <script>

        let produtosDisponiveis = [];

        function preencherSeletor(select) {
            select.innerHTML = '<option value="">Selecione um produto</option>';

            produtosDisponiveis.forEach(produto => {
                const opcao = document.createElement('option');
                opcao.value = produto.id;
                opcao.textContent =
                    `${produto.nome} - R$ ${Number(produto.preco).toFixed(2)}`;
                select.appendChild(opcao);
            });
        }

        async function carregarProdutosPedido() {
            try {
                const response = await fetch('/api/produtos');

                if (!response.ok) {
                    throw new Error('Não foi possível carregar os produtos.');
                }

                const produtos = await response.json();
                produtosDisponiveis = produtos.filter(produto => produto.ativo === true);

                document.querySelectorAll('.produto-item')
                    .forEach(preencherSeletor);

            } catch (erro) {
                alert('Erro ao carregar produtos: ' + erro.message);
            }
        }

        document.getElementById('adicionarItem').addEventListener('click', function () {
            const container = document.getElementById('itensPedido');
            const primeiraLinha = container.querySelector('.item-pedido');
            const novaLinha = primeiraLinha.cloneNode(true);

            novaLinha.querySelector('.produto-item').value = '';
            novaLinha.querySelector('.quantidade-item').value = 1;

            container.appendChild(novaLinha);
            preencherSeletor(novaLinha.querySelector('.produto-item'));
        });

        document.getElementById('pedidoForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const itens = Array.from(document.querySelectorAll('.item-pedido'))
                .map(linha => ({
                    produtoId: linha.querySelector('.produto-item').value,
                    quantidade: Number(linha.querySelector('.quantidade-item').value)
                }));

            if (itens.length === 0 ||
                itens.some(item => !item.produtoId ||
                    !Number.isInteger(item.quantidade) ||
                    item.quantidade <= 0)) {
                alert('Selecione os produtos e informe quantidades válidas.');
                return;
            }

            const pedido = {
                clienteId: document.getElementById('clienteId').value.trim(),
                itens: itens
            };

            try {
                const response = await fetch('/api/pedidos', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(pedido)
                });

                if (!response.ok) {
                    throw new Error('Não foi possível registrar o pedido.');
                }

                const pedidoSalvo = await response.json();

                alert(
                    'Pedido registrado com sucesso!\n' +
                    'Total: R$ ' +
                    Number(pedidoSalvo.valorTotal).toFixed(2).replace('.', ',')
                );

                window.location.reload();

            } catch (erro) {
                alert('Erro ao registrar pedido: ' + erro.message);
            }
        });

        carregarProdutosPedido();

        async function mostrarNomesProdutos() {
            try {
                const response = await fetch('/api/produtos');

                if (!response.ok) {
                    throw new Error('Não foi possível consultar os produtos.');
                }

                const produtos = await response.json();

                const nomesPorId = new Map(
                    produtos.map(produto => [produto.id, produto.nome])
                );

                document.querySelectorAll('.nome-produto').forEach(elemento => {
                    const id = elemento.dataset.produtoId;
                    const nome = nomesPorId.get(id);

                    if (nome) {
                        elemento.textContent = nome;
                    }
                });

            } catch (erro) {
                console.error('Erro ao carregar nomes dos produtos:', erro);
            }
        }

        mostrarNomesProdutos();

        document.querySelectorAll('.atualizar-status').forEach(botao => {
            botao.addEventListener('click', async function () {
                const id = botao.dataset.pedidoId;
                const seletor = botao.closest('td').querySelector('.status-pedido');
                const status = seletor.value;

                if (!status) {
                    alert('Selecione um status.');
                    return;
                }

                try {
                    const response = await fetch(
                        `/api/pedidos/${encodeURIComponent(id)}/status?status=${encodeURIComponent(status)}`,
                        { method: 'PUT' }
                    );

                    if (!response.ok) {
                        throw new Error('Não foi possível atualizar o status.');
                    }

                    alert('Status atualizado com sucesso!');
                    window.location.reload();

                } catch (erro) {
                    alert('Erro: ' + erro.message);
                }
            });
        });

        document.querySelectorAll('.aplicar-desconto').forEach(botao => {
            botao.addEventListener('click', async function () {
                const id = botao.dataset.pedidoId;
                const campo = botao.closest('td').querySelector('.percentual-desconto');
                const percentual = Number(campo.value);

                if (campo.value.trim() === '' ||
                    !Number.isFinite(percentual) ||
                    percentual < 0 ||
                    percentual > 20) {
                    alert('Informe um desconto entre 0% e 20%.');
                    return;
                }

                try {
                    const response = await fetch(
                        `/api/pedidos/${encodeURIComponent(id)}/desconto?percentual=${encodeURIComponent(percentual)}`,
                        { method: 'PUT' }
                    );

                    if (!response.ok) {
                        throw new Error('Não foi possível aplicar o desconto.');
                    }

                    alert('Desconto aplicado com sucesso!');
                    window.location.reload();

                } catch (erro) {
                    alert('Erro: ' + erro.message);
                }
            });
        });

        document.querySelectorAll('.cancelar-pedido').forEach(botao => {
            botao.addEventListener('click', async function () {
                const id = botao.dataset.pedidoId;
                const justificativa = prompt('Informe a justificativa do cancelamento:');

                if (justificativa === null) {
                    return;
                }

                if (justificativa.trim() === '') {
                    alert('É obrigatório informar uma justificativa.');
                    return;
                }

                if (!confirm('Tem certeza de que deseja cancelar este pedido?')) {
                    return;
                }

                try {
                    const response = await fetch(
                        `/api/pedidos/${encodeURIComponent(id)}/cancelar?justificativa=${encodeURIComponent(justificativa.trim())}`,
                        { method: 'PUT' }
                    );

                    if (!response.ok) {
                        throw new Error('Não foi possível cancelar o pedido.');
                    }

                    alert('Pedido cancelado com sucesso!');
                    window.location.reload();

                } catch (erro) {
                    alert('Erro: ' + erro.message);
                }
            });
        });

    </script>

</div>

</body>
</html>
